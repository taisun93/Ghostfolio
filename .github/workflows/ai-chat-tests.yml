# Run AI chat golden-set tests and report. Use when local runs hit OOM.
# Trigger manually from Actions tab, or on push to AI-related paths.
name: AI Chat Test Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/app/endpoints/ai/**'
      - 'apps/api/jest.config.ts'
      - 'apps/api/scripts/run-ai-chat-tests-and-report.mjs'
      - '.github/workflows/ai-chat-tests.yml'

permissions:
  contents: read

jobs:
  ai-chat-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Larger heap for Jest (runner has ~7GB); OPENAI_API_KEY optional for LLM tests
      - name: Run AI chat tests and generate report
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx dotenv-cli -e .env.example -- node apps/api/scripts/run-ai-chat-tests-and-report.mjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-results
          path: apps/api/src/app/endpoints/ai/AI_CHAT_TEST_RESULTS_10.md
