# Run AI chat golden-set tests and report. Use when local runs hit OOM.
# Disabled for push: runs only when triggered manually from the Actions tab.
name: AI Chat Test Report

on:
  workflow_dispatch:
  # push trigger disabled — use "AI Chat No Mock Tests" workflow for automatic runs
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/api/src/app/endpoints/ai/**'
  #     - 'apps/api/jest.config.ts'
  #     - 'apps/api/scripts/run-ai-chat-tests-and-report.mjs'
  #     - '.github/workflows/ai-chat-tests.yml'

permissions:
  contents: read

jobs:
  ai-chat-report:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Larger heap for Jest (runner has ~7GB). API key from Production env → LLM tests run.
      - name: Run AI chat tests and generate report
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          OPENAI_API_KEY: ${{ secrets.API_KEY_OPENAI }}
        run: npx dotenv-cli -e .env.example -- node apps/api/scripts/run-ai-chat-tests-and-report.mjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-results
          path: apps/api/src/app/endpoints/ai/AI_CHAT_TEST_RESULTS_10.md
