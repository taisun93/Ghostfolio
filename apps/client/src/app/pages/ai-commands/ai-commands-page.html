<div class="ai-chat">
  <div class="ai-chat-header">
    <h1 class="ai-chat-title" i18n>AI Commands</h1>
    <p class="ai-chat-subtitle" i18n>Ask about your portfolio or run actions in plain language.</p>
  </div>

  <div class="ai-chat-messages" #messagesContainer>
    @for (msg of messages; track msg.id) {
      <div class="ai-chat-row" [class.ai-chat-row-user]="msg.role === 'user'" [class.ai-chat-row-assistant]="msg.role === 'assistant'">
        @if (msg.role === 'assistant') {
          <div class="ai-chat-avatar ai-chat-avatar-assistant" aria-hidden="true">AI</div>
        }
        <div class="ai-chat-bubble" [class.ai-chat-bubble-user]="msg.role === 'user'" [class.ai-chat-bubble-assistant]="msg.role === 'assistant'">
          <span class="ai-chat-text">{{ msg.text }}</span>
        </div>
        @if (msg.role === 'user') {
          <div class="ai-chat-avatar ai-chat-avatar-user" aria-hidden="true">You</div>
        }
      </div>
    }
    @if (isThinking) {
      <div class="ai-chat-row ai-chat-row-assistant">
        <div class="ai-chat-avatar ai-chat-avatar-assistant" aria-hidden="true">AI</div>
        <div class="ai-chat-bubble ai-chat-bubble-assistant ai-chat-thinking">
          <span class="ai-chat-dots">
            <span></span><span></span><span></span>
          </span>
        </div>
      </div>
    }
    <div #messagesEnd class="ai-chat-anchor"></div>
  </div>

  <div class="ai-chat-input-wrap">
    <mat-form-field class="ai-chat-input-field" appearance="outline">
      <mat-label i18n>Message</mat-label>
      <input
        matInput
        [(ngModel)]="inputText"
        (keydown.enter)="$event.preventDefault(); send()"
        [disabled]="isThinking"
        placeholder="e.g. What is my total return?"
      />
    </mat-form-field>
    <button
      class="ai-chat-send"
      mat-flat-button
      color="primary"
      [disabled]="!inputText?.trim() || isThinking"
      (click)="send()"
      i18n
    >
      Send
    </button>
  </div>
</div>
