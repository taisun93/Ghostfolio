<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghostfolio</title>
    <meta http-equiv="refresh" content="0;url=/en/" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #1e293b;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #94a3b8;
        font-size: 1rem;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
        margin-top: 1.5rem;
        display: inline-block;
      }
      a:hover { text-decoration: underline; }
    </style>
    <script>
      (function () {
        var supported = ['ca', 'de', 'en', 'es', 'fr', 'it', 'ko', 'nl', 'pl', 'pt', 'tr', 'uk', 'zh'];
        var lang = (navigator.language || navigator.userLanguage || 'en').slice(0, 2).toLowerCase();
        var target = supported.indexOf(lang) >= 0 ? lang : 'en';
        location.replace('/' + target + '/');
      })();
    </script>
  </head>
  <body>
    <h1>Ghostfolio</h1>
    <p>Loading… If you are not redirected, <a href="/en/">continue here</a>.</p>
  </body>
</html>
